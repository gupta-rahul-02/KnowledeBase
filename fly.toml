app = "knowledebase-rag"
primary_region = "iad"

[build]
  image = "ghcr.io/gupta-rahul-02/knowledebase:latest"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  HF_HOME = "/data/hf_cache"
  SENTENCE_TRANSFORMERS_HOME = "/data/hf_cache"
  LOG_LEVEL = "INFO"
  ALLOWED_ORIGINS = "https://knowledebase-rag.fly.dev"

[[mounts]]
  source = "kb_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512

# Secrets (never checked in) are set via:
#   flyctl secrets set GROQ_API_KEY=... ADMIN_API_KEY=...
